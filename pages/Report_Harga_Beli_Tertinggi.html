<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Daftar Harga Beli Tertinggi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F6;
    --surface:#FFFFFF;
    --surface-alt:#F5F7FB;
    --border:#E1E7F0;
    --border-soft:#EBEFF5;
    --text-primary:#16202E;
    --text-secondary:#5B6779;
    --text-muted:#8B95A6;
    --navy:#122A55;
    --blue-700:#1E4FBF;
    --blue-600:#2F63E0;
    --blue-500:#4C7EF2;
    --blue-100:#E4ECFC;
    --blue-50:#F2F5FE;
    --success:#0E9C6F;
    --success-bg:#E4F7EE;
    --danger:#DB4B5C;
    --danger-bg:#FCE9EB;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(20,34,64,.05);
    --shadow-md:0 8px 24px -8px rgba(20,34,64,.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text-primary);}
  .app{max-width:1800px;margin:0 auto;padding:24px 24px 64px;}

  /* ---------- SUMMARY CARDS ---------- */
  .kpi-row{
    display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;
  }
  .kpi-card{
    background:var(--surface);border-radius:var(--radius);padding:16px 18px;
    box-shadow:var(--shadow-sm);border:1px solid var(--border-soft);
  }
  .kpi-top{display:flex;align-items:center;gap:10px;}
  .kpi-icon{
    width:34px;height:34px;border-radius:9px;background:var(--blue-50);
    display:flex;align-items:center;justify-content:center;color:var(--blue-600);flex-shrink:0;
  }
  .kpi-icon svg{width:17px;height:17px;}
  .kpi-label{font-size:12.5px;color:var(--text-secondary);font-weight:500;flex:1;min-width:0;}
  .kpi-value{font-family:'Sora',sans-serif;font-size:22px;font-weight:700;margin-top:12px;color:var(--text-primary);}

  /* ---------- FILTER PANEL ---------- */
  .panel{
    background:var(--surface);border-radius:var(--radius);border:1px solid var(--border-soft);
    box-shadow:var(--shadow-sm);
  }
  .panel-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 22px;border-bottom:1px solid var(--border-soft);
  }
  .panel-title{display:flex;align-items:center;gap:10px;}
  .panel-title-ic{
    width:30px;height:30px;border-radius:8px;background:var(--blue-50);color:var(--blue-600);
    display:flex;align-items:center;justify-content:center;
  }
  .panel-title-ic svg{width:15px;height:15px;}
  .panel-title h3{margin:0;font-size:14.5px;font-weight:700;font-family:'Sora',sans-serif;}
  .panel-title span{display:block;font-size:12px;color:var(--text-muted);margin-top:1px;}
  .panel-header-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .btn-reset-filter, .btn-toggle-filter{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:12px;font-weight:600;border-radius:8px;
    padding:7px 12px;cursor:pointer;transition:.15s;flex-shrink:0;
  }
  .btn-reset-filter:hover, .btn-toggle-filter:hover{border-color:var(--blue-500);color:var(--blue-700);background:var(--blue-50);}
  .btn-reset-filter svg{width:13px;height:13px;flex-shrink:0;}
  .btn-toggle-filter svg{transition:.2s transform;flex-shrink:0;}
  .btn-toggle-filter.collapsed svg{transform:rotate(-90deg);}

  .filter-body{display:grid;grid-template-rows:1fr;transition:.22s grid-template-rows, .22s opacity;}
  .filter-body.collapsed{grid-template-rows:0fr;opacity:0;}
  .filter-body-inner{min-height:0;}
  .filter-body.collapsed .filter-body-inner{overflow:hidden;}
  .filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px 22px;}
  .field label{
    font-size:12px;font-weight:600;color:var(--text-secondary);
    display:flex;align-items:center;gap:6px;margin-bottom:7px;
  }
  .field .checkline{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .field .checkline input{accent-color:var(--blue-600);width:14px;height:14px;}
  .field .checkline label{margin:0;}
  .control{
    width:100%;border:1px solid var(--border);background:var(--surface-alt);border-radius:9px;
    padding:9px 12px;font-size:13px;font-family:'Inter',sans-serif;color:var(--text-primary);transition:.15s;
  }
  .control:focus{outline:none;border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 3px var(--blue-100);}
  .control:disabled{opacity:.55;cursor:not-allowed;}
  .date-row{display:flex;align-items:center;gap:8px;}
  .date-row span{color:var(--text-muted);font-size:12px;}

  /* multi-select part number */
  .msel{position:relative;}
  .msel-box{display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .msel-box .txt{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .msel-dd{
    position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow-md);padding:10px;display:none;max-height:260px;overflow:auto;
  }
  .msel-dd.open{display:block;}
  .msel-search{margin-bottom:8px;}
  .msel-item{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:7px;font-size:13px;cursor:pointer;}
  .msel-item:hover{background:var(--surface-alt);}
  .msel-item input{accent-color:var(--blue-600);width:14px;height:14px;}
  .msel-sep{height:1px;background:var(--border-soft);margin:6px 0;}
  .msel-selectall{font-weight:600;color:var(--blue-700);}

  /* ---------- TABLE CARD ---------- */
  .table-card{
    background:var(--surface);border-radius:var(--radius);border:1px solid var(--border-soft);
    box-shadow:var(--shadow-sm);margin-top:20px;
  }
  .table-toolbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    padding:18px 22px;border-bottom:1px solid var(--border-soft);
  }
  .table-toolbar h3{margin:0;font-family:'Sora',sans-serif;font-size:15.5px;font-weight:700;}
  .table-toolbar .count-badge{
    font-size:11.5px;font-weight:600;background:var(--blue-50);color:var(--blue-700);
    padding:3px 10px;border-radius:999px;margin-left:8px;
  }
  .toolbar-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .search-wrap{position:relative;width:240px;max-width:100%;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);}
  .search-wrap input{width:100%;padding:9px 12px 9px 34px;border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);font-size:13px;}
  .search-wrap input:focus{outline:none;border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 3px var(--blue-100);}
  .export-group{display:flex;gap:8px;}
  .btn-export{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border);background:var(--surface-alt);
    color:var(--text-primary);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;border-radius:9px;
    padding:8px 13px;cursor:pointer;transition:.15s;
  }
  .btn-export svg{width:14px;height:14px;flex-shrink:0;}
  .btn-export:hover{background:var(--blue-50);border-color:var(--blue-100);color:var(--blue-700);}
  .btn-export.pdf:hover{background:var(--danger-bg);border-color:#F3C6CB;color:var(--danger);}
  .btn-export.excel:hover{background:var(--success-bg);border-color:#BFE9D5;color:var(--success);}

  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:760px;}
  thead th{
    background:var(--surface-alt);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text-secondary);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);
    white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0;z-index:1;
  }
  thead th:hover{color:var(--blue-700);}
  thead th.no-sort{cursor:default;}
  thead th.no-sort:hover{color:var(--text-secondary);}
  thead th .th-in{display:flex;align-items:center;gap:6px;}
  thead th.c-center .th-in{justify-content:center;}
  thead th.c-right .th-in{justify-content:flex-end;}
  .sort-ic{width:11px;height:11px;opacity:.35;flex-shrink:0;}
  thead th.active .sort-ic{opacity:1;color:var(--blue-600);}
  tbody td{padding:12px 16px;font-size:13px;color:var(--text-primary);border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tbody td.c-center{text-align:center;}
  tbody td.c-right{text-align:right;font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:var(--blue-50);}
  .tag{
    display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;
    background:var(--blue-50);color:var(--blue-700);
  }
  .tag.pn{background:var(--surface-alt);color:var(--text-secondary);border:1px solid var(--border);}
  .price-cell{font-weight:700;color:var(--text-primary);}
  .row-idx{color:var(--text-muted);font-size:12.5px;}

  .empty-state{padding:70px 20px;text-align:center;}
  .empty-state .ic{
    width:64px;height:64px;border-radius:16px;background:var(--blue-50);color:var(--blue-500);
    display:flex;align-items:center;justify-content:center;margin:0 auto 18px;
  }
  .empty-state .ic svg{width:30px;height:30px;}
  .empty-state h4{margin:0 0 6px;font-family:'Sora',sans-serif;font-size:16px;}
  .empty-state p{margin:0;color:var(--text-secondary);font-size:13.5px;}

  .table-footer{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:14px;
    padding:16px 22px;border-top:1px solid var(--border-soft);
  }
  .rows-select{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);}
  .rows-select select{border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;background:var(--surface-alt);}
  .entries-info{font-size:13px;color:var(--text-secondary);}
  .pagination{display:flex;gap:6px;align-items:center;}
  .page-btn{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:600;color:var(--text-secondary);
  }
  .page-btn:hover:not(:disabled){background:var(--surface-alt);}
  .page-btn.active{background:linear-gradient(135deg,var(--blue-500),var(--blue-700));color:#fff;border-color:transparent;}
  .page-btn:disabled{opacity:.4;cursor:not-allowed;}

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
    padding:13px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:10px;transform:translateY(20px);opacity:0;
    transition:.25s;pointer-events:none;z-index:100;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast svg{width:16px;height:16px;color:#4ADE80;flex-shrink:0;}

  @media (max-width:1100px){
    .kpi-row{grid-template-columns:repeat(2,1fr);}
    .filter-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:640px){
    .kpi-row{grid-template-columns:1fr;}
    .filter-grid{grid-template-columns:1fr;}
    .app{padding:16px 14px 40px;}
    .table-toolbar{flex-direction:column;align-items:flex-start;}
    .search-wrap{width:100%;}
    .toolbar-right{width:100%;justify-content:space-between;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="kpi-row" id="kpiRow"></div>

  <!-- FILTER PANEL -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 3H2l8 9.46V19l4 2v-8.54L22 3z"/></svg>
        </div>
        <div>
          <h3>Filter &amp; Pencarian</h3>
          <span>Saring data harga beli sesuai kebutuhan analisis Anda</span>
        </div>
      </div>
      <div class="panel-header-actions">
        <button class="btn-reset-filter" id="btnResetFilter" onclick="resetFilters()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
          Reset
        </button>
        <button class="btn-toggle-filter" id="btnToggleFilter" onclick="toggleFilterPanel()" aria-expanded="true">
          <span id="toggleFilterLabel">Sembunyikan</span>
          <svg id="toggleFilterIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-body" id="filterBody">
    <div class="filter-body-inner">
    <div class="filter-grid">
      <div class="field">
        <div class="checkline">
          <input type="checkbox" id="dateToggle" onchange="toggleDate(); applyFilters();">
          <label for="dateToggle">Periode Tanggal PO</label>
        </div>
        <div class="date-row">
          <input type="date" class="control" id="dateFrom" disabled onchange="applyFilters()">
          <span>—</span>
          <input type="date" class="control" id="dateTo" disabled onchange="applyFilters()">
        </div>
      </div>

      <div class="field">
        <label>Kode Barang</label>
        <select class="control" id="kodeBarang" onchange="syncFromKode(); applyFilters();">
          <option value="">Semua Kode Barang</option>
        </select>
      </div>

      <div class="field">
        <label>Nama Barang</label>
        <select class="control" id="namaBarang" onchange="syncFromNama(); applyFilters();">
          <option value="">Semua Nama Barang</option>
        </select>
      </div>

      <div class="field msel" id="partNumberField">
        <label>Part Number</label>
        <div class="control msel-box" onclick="toggleMsel()">
          <span class="txt" id="partNumberLabel">All Part Number Selected</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="msel-dd" id="partNumberDD">
          <input class="control msel-search" placeholder="Cari part number..." id="partNumberSearch" oninput="renderPartNumberList()">
          <div class="msel-item msel-selectall" onclick="toggleSelectAllPartNumber(event)">
            <input type="checkbox" id="partNumberSelectAll"> <span>Select All</span>
          </div>
          <div class="msel-sep"></div>
          <div id="partNumberList"></div>
        </div>
      </div>
    </div>
    </div>
    </div>
  </div>

  <!-- TABLE CARD -->
  <div class="table-card">
    <div class="table-toolbar">
      <div>
        <h3 style="display:inline;">Daftar Harga Beli Tertinggi</h3>
        <span class="count-badge" id="resultBadge">0 records</span>
      </div>
      <div class="toolbar-right">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" id="globalSearch" placeholder="Cari Part Number / Kode / Nama Barang..." oninput="onSearch()">
        </div>
        <div class="export-group">
          <button class="btn-export pdf" onclick="exportPDF()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
            Export PDF
          </button>
          <button class="btn-export excel" onclick="exportExcel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9.5 13.5l5 5M14.5 13.5l-5 5"/></svg>
            Export Excel
          </button>
        </div>
      </div>
    </div>

    <div class="table-scroll">
      <table>
        <thead>
          <tr id="theadRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div id="emptyState" class="empty-state" style="display:none;">
      <div class="ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/><path d="M8 11h6"/></svg>
      </div>
      <h4>Data tidak ditemukan</h4>
      <p>Coba ubah kombinasi filter atau kata kunci pencarian Anda.</p>
    </div>

    <div class="table-footer">
      <div class="rows-select">
        Tampilkan
        <select id="rowsPerPage" onchange="onRowsChange()">
          <option value="10" selected>10</option>
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
          <option value="all">All</option>
        </select>
        entries
      </div>
      <div class="entries-info" id="entriesInfo">Showing 0 to 0 of 0 entries</div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ============== SAMPLE DATA GENERATION ============== */
/* Katalog item: [partNumber, kodeBarang, namaBarang, uom, hargaDasar] */
const ITEMS = [
  ["SKF-6205-2RS","BRG-00001","Bearing SKF 6205-2RS","PCS",145000],
  ["NBK-BRG-6204","BRG-00002","Bearing NBK 6204","PCS",98000],
  ["GATES-A47","BLT-00010","V-Belt Gates A-47","PCS",62000],
  ["OPTIBELT-A52","BLT-00011","V-Belt Optibelt A-52","PCS",67000],
  ["PARKER-1SN-12","HSE-00003","Selang Hidrolik 1/2 Inch","MTR",185000],
  ["EATON-2SN-08","HSE-00004","Selang Hidrolik 3/8 Inch","MTR",152000],
  ["SS400-10-1224","PLT-00007","Plat Besi SS400 10mm","LBR",5250000],
  ["SS400-12-1224","PLT-00008","Plat Besi SS400 12mm","LBR",6100000],
  ["SEW-R47-DRN80","GBX-00002","Gearbox Reducer SEW R47","UNIT",4750000],
  ["NORD-SK9032","GBX-00003","Gearbox Reducer Nord SK9032","UNIT",5200000],
  ["YAZAKI-NYY-4X25","CBL-00005","Kabel NYY 4x2.5mm","MTR",28500],
  ["SUPREME-NYY-4X4","CBL-00006","Kabel NYY 4x4mm","MTR",39500],
  ["DONALDSON-P550388","FLT-00009","Filter Oli Hidrolik","PCS",215000],
  ["MANN-W940","FLT-00010","Filter Oli Mesin","PCS",87000],
  ["ARCO-HTB-M16","BLT-00012","Baut HTB M16 x 60","PCS",8500],
  ["ARCO-HTB-M20","BLT-00013","Baut HTB M20 x 80","PCS",14500],
  ["MITSUBISHI-EM10X95","TOO-00697","Endmill Long 10mm x 95mm","PCS",375000],
  ["SANDVIK-CNMG-120408","TOO-00512","Insert CNMG 120408","PCS",109500],
  ["3M-8210-N95","APD-00023","Masker N95 3M 8210","PCS",32000],
  ["MSA-VGARD","APD-00024","Safety Helmet MSA V-Gard","PCS",145000],
];

function pad(n){return n.toString().padStart(2,'0');}
function randDate(){
  const start = new Date(2026,0,1).getTime();
  const end = new Date(2026,6,20).getTime();
  const t = start + Math.random()*(end-start);
  const d = new Date(t);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function fmtDateID(iso){
  const [y,m,d] = iso.split('-');
  const months=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  return `${d} ${months[parseInt(m)-1]} ${y}`;
}
function roundPrice(v){ return Math.round(v/100)*100; }

const DATA = [];
let seq = 30;
for(let i=0;i<220;i++){
  const item = ITEMS[Math.floor(Math.random()*ITEMS.length)];
  const factor = 0.82 + Math.random()*0.55; // fluktuasi harga antar PO / supplier
  seq++;
  const noPoPrefix = Math.random()>0.5
    ? `PO2606${(1000+seq).toString().slice(-4)}/STU/${["MCN","PST","AU","H","TO"][Math.floor(Math.random()*5)]}`
    : `PO335/06/26/${(40+i).toString().padStart(4,'0')}`;
  DATA.push({
    tglPo: randDate(),
    noPo: noPoPrefix,
    partNumber: item[0],
    kodeBarang: item[1],
    namaBarang: item[2],
    uom: item[3],
    harga: roundPrice(item[4]*factor)
  });
}
DATA.sort((a,b)=> a.tglPo < b.tglPo ? 1 : -1);

const PART_NUMBERS = ITEMS.map(it=>it[0]);

/* ============== STATE ============== */
let state = {
  sortKey: 'harga',
  sortDir: 'desc',
  page: 1,
  rowsPerPage: 10,
  search: '',
  filters: { dateOn:false, from:null, to:null, kode:'', nama:'', partNumbers: new Set(PART_NUMBERS) }
};

const COLUMNS = [
  {key:'partNumber', label:'Part Number', align:'left'},
  {key:'kodeBarang', label:'Kode Barang', align:'center'},
  {key:'namaBarang', label:'Nama Barang', align:'left'},
  {key:'uom', label:'UOM', align:'center'},
  {key:'harga', label:'Harga Tertinggi', align:'right'},
];

/* ============== INIT FILTER OPTIONS ============== */
function initFilterOptions(){
  const kodeSel = document.getElementById('kodeBarang');
  const namaSel = document.getElementById('namaBarang');
  ITEMS.forEach(it=>{
    const o1 = document.createElement('option'); o1.value = it[1]; o1.textContent = it[1]; kodeSel.appendChild(o1);
    const o2 = document.createElement('option'); o2.value = it[1]; o2.textContent = it[2]; namaSel.appendChild(o2);
  });
  state.filters.partNumbers = new Set(PART_NUMBERS);
  renderPartNumberList();
  updatePartNumberLabel();
}
function syncFromKode(){
  const v = document.getElementById('kodeBarang').value;
  document.getElementById('namaBarang').value = v || '';
}
function syncFromNama(){
  const v = document.getElementById('namaBarang').value;
  document.getElementById('kodeBarang').value = v || '';
}

/* ============== MULTI-SELECT PART NUMBER ============== */
function toggleMsel(){
  document.getElementById('partNumberDD').classList.toggle('open');
}
document.addEventListener('click', (e)=>{
  const field = document.getElementById('partNumberField');
  if(!field.contains(e.target)) document.getElementById('partNumberDD').classList.remove('open');
});
function renderPartNumberList(){
  const q = (document.getElementById('partNumberSearch').value || '').toLowerCase();
  const list = document.getElementById('partNumberList');
  list.innerHTML = '';
  PART_NUMBERS.filter(s=>s.toLowerCase().includes(q)).forEach(s=>{
    const row = document.createElement('div');
    row.className = 'msel-item';
    const checked = state.filters.partNumbers.has(s) ? 'checked' : '';
    row.innerHTML = `<input type="checkbox" ${checked} data-s="${s}"><span>${s}</span>`;
    row.onclick = (e)=>{
      if(e.target.tagName !== 'INPUT'){
        const cb = row.querySelector('input'); cb.checked = !cb.checked;
      }
      const s2 = row.querySelector('input').getAttribute('data-s');
      if(row.querySelector('input').checked) state.filters.partNumbers.add(s2);
      else state.filters.partNumbers.delete(s2);
      updatePartNumberLabel();
      syncSelectAllCheckbox();
      state.page = 1;
      render();
    };
    list.appendChild(row);
  });
  syncSelectAllCheckbox();
}
function syncSelectAllCheckbox(){
  document.getElementById('partNumberSelectAll').checked = state.filters.partNumbers.size === PART_NUMBERS.length;
}
function toggleSelectAllPartNumber(e){
  e.stopPropagation();
  const cb = document.getElementById('partNumberSelectAll');
  cb.checked = !cb.checked;
  if(cb.checked){ state.filters.partNumbers = new Set(PART_NUMBERS); }
  else { state.filters.partNumbers = new Set(); }
  renderPartNumberList();
  updatePartNumberLabel();
  state.page = 1;
  render();
}
function updatePartNumberLabel(){
  const n = state.filters.partNumbers.size;
  const label = document.getElementById('partNumberLabel');
  if(n === PART_NUMBERS.length) label.textContent = 'All Part Number Selected';
  else if(n === 0) label.textContent = 'No Part Number Selected';
  else label.textContent = `${n} Part Number Dipilih`;
}

/* ============== DATE TOGGLE ============== */
function toggleDate(){
  const on = document.getElementById('dateToggle').checked;
  document.getElementById('dateFrom').disabled = !on;
  document.getElementById('dateTo').disabled = !on;
}

/* ============== FILTER / RESET ============== */
function applyFilters(){
  state.filters.dateOn = document.getElementById('dateToggle').checked;
  state.filters.from = document.getElementById('dateFrom').value || null;
  state.filters.to = document.getElementById('dateTo').value || null;
  state.filters.kode = document.getElementById('kodeBarang').value;
  state.filters.nama = document.getElementById('namaBarang').value;
  state.page = 1;
  render();
}
function resetFilters(){
  document.getElementById('dateToggle').checked = false;
  document.getElementById('dateFrom').value = '';
  document.getElementById('dateTo').value = '';
  document.getElementById('dateFrom').disabled = true;
  document.getElementById('dateTo').disabled = true;
  document.getElementById('kodeBarang').value = '';
  document.getElementById('namaBarang').value = '';
  document.getElementById('globalSearch').value = '';
  state.filters = { dateOn:false, from:null, to:null, kode:'', nama:'', partNumbers: new Set(PART_NUMBERS) };
  state.search = '';
  state.page = 1;
  renderPartNumberList();
  updatePartNumberLabel();
  render();
  showToast('Filter direset ke kondisi awal');
}
function onSearch(){
  state.search = document.getElementById('globalSearch').value.trim().toLowerCase();
  state.page = 1;
  render();
}
function toggleFilterPanel(){
  const body = document.getElementById('filterBody');
  const btn = document.getElementById('btnToggleFilter');
  const label = document.getElementById('toggleFilterLabel');
  const collapsed = body.classList.toggle('collapsed');
  btn.classList.toggle('collapsed', collapsed);
  btn.setAttribute('aria-expanded', String(!collapsed));
  label.textContent = collapsed ? 'Tampilkan' : 'Sembunyikan';
}

/* ============== DATA PROCESSING ============== */
/* 1) Filter data PO mentah sesuai filter yang aktif */
function filteredPO(){
  let rows = DATA.slice();
  const f = state.filters;
  if(f.dateOn && f.from) rows = rows.filter(r => r.tglPo >= f.from);
  if(f.dateOn && f.to) rows = rows.filter(r => r.tglPo <= f.to);
  if(f.kode) rows = rows.filter(r => r.kodeBarang === f.kode);
  if(f.nama) rows = rows.filter(r => r.kodeBarang === f.nama);
  if(f.partNumbers.size < PART_NUMBERS.length) rows = rows.filter(r => f.partNumbers.has(r.partNumber));
  return rows;
}

/* 2) Group by Kode Barang + Part Number + Nama Barang + UOM, ambil Harga TERTINGGI */
function buildAggregates(rows){
  const map = new Map();
  rows.forEach(r=>{
    const key = r.partNumber+'|'+r.kodeBarang+'|'+r.namaBarang+'|'+r.uom;
    const existing = map.get(key);
    if(!existing || r.harga > existing.harga){
      map.set(key, { partNumber:r.partNumber, kodeBarang:r.kodeBarang, namaBarang:r.namaBarang, uom:r.uom, harga:r.harga });
    }
  });
  return Array.from(map.values());
}

/* 3) Terapkan pencarian teks + sorting pada hasil agregasi */
function getResultRows(){
  let rows = buildAggregates(filteredPO());
  if(state.search){
    const q = state.search;
    rows = rows.filter(r =>
      r.partNumber.toLowerCase().includes(q) ||
      r.kodeBarang.toLowerCase().includes(q) ||
      r.namaBarang.toLowerCase().includes(q)
    );
  }
  rows.sort((a,b)=>{
    let va = a[state.sortKey], vb = b[state.sortKey];
    if(typeof va === 'string'){ va = va.toLowerCase(); vb = vb.toLowerCase(); }
    if(va < vb) return state.sortDir === 'asc' ? -1 : 1;
    if(va > vb) return state.sortDir === 'asc' ? 1 : -1;
    return 0;
  });
  return rows;
}

function sortBy(key){
  if(state.sortKey === key){ state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc'; }
  else { state.sortKey = key; state.sortDir = 'asc'; }
  render();
}
function onRowsChange(){
  const v = document.getElementById('rowsPerPage').value;
  state.rowsPerPage = v === 'all' ? 'all' : parseInt(v);
  state.page = 1;
  render();
}
function goPage(p){ state.page = p; render(); }

/* ============== RENDER ============== */
function idr(n){ return 'Rp' + Math.round(n).toLocaleString('id-ID'); }

function renderHead(){
  const tr = document.getElementById('theadRow');
  tr.innerHTML = '';
  COLUMNS.forEach(c=>{
    const th = document.createElement('th');
    th.className = c.align === 'center' ? 'c-center' : c.align === 'right' ? 'c-right' : '';
    if(c.key === state.sortKey) th.classList.add('active');
    const arrowUp = `<svg class="sort-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 8H5z"/></svg>`;
    const arrowDown = `<svg class="sort-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 19l-7-8h14z"/></svg>`;
    const isActive = c.key === state.sortKey;
    const arrow = isActive ? (state.sortDir === 'asc' ? arrowUp : arrowDown) : `<svg class="sort-ic" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5l7 8H5z"/></svg>`;
    th.innerHTML = `<div class="th-in"><span>${c.label}</span>${arrow}</div>`;
    th.onclick = ()=> sortBy(c.key);
    tr.appendChild(th);
  });
}

function render(){
  renderHead();
  const rows = getResultRows();
  const total = rows.length;
  const perPage = state.rowsPerPage === 'all' ? Math.max(total,1) : state.rowsPerPage;
  const totalPages = Math.max(1, Math.ceil(total/perPage));
  if(state.page > totalPages) state.page = totalPages;
  const startIdx = (state.page-1)*perPage;
  const pageRows = rows.slice(startIdx, startIdx+perPage);

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';

  if(pageRows.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    pageRows.forEach(r=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="tag pn">${r.partNumber}</span></td>
        <td class="c-center"><span class="tag">${r.kodeBarang}</span></td>
        <td>${r.namaBarang}</td>
        <td class="c-center">${r.uom}</td>
        <td class="c-right price-cell">${idr(r.harga)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById('resultBadge').textContent = `${total.toLocaleString('id-ID')} records`;
  const showFrom = total === 0 ? 0 : startIdx+1;
  const showTo = Math.min(startIdx+perPage, total);
  document.getElementById('entriesInfo').textContent = `Showing ${showFrom} to ${showTo} of ${total.toLocaleString('id-ID')} entries`;

  renderPagination(totalPages);
  renderKPI(rows);
}

function renderPagination(totalPages){
  const wrap = document.getElementById('pagination');
  wrap.innerHTML = '';
  const mkBtn = (label, page, opts={}) => {
    const b = document.createElement('button');
    b.className = 'page-btn' + (opts.active ? ' active' : '');
    b.textContent = label;
    b.disabled = !!opts.disabled;
    b.onclick = ()=> goPage(page);
    return b;
  };
  wrap.appendChild(mkBtn('‹', state.page-1, {disabled: state.page<=1}));
  let pages = [];
  const cur = state.page;
  for(let p=1;p<=totalPages;p++){
    if(p===1 || p===totalPages || (p>=cur-1 && p<=cur+1)) pages.push(p);
  }
  let prev = 0;
  pages.forEach(p=>{
    if(prev && p - prev > 1){
      const dots = document.createElement('span');
      dots.textContent = '…';
      dots.style.color = 'var(--text-muted)';
      dots.style.padding = '0 4px';
      wrap.appendChild(dots);
    }
    wrap.appendChild(mkBtn(p, p, {active: p===cur}));
    prev = p;
  });
  wrap.appendChild(mkBtn('›', state.page+1, {disabled: state.page>=totalPages}));
}

function renderKPI(rows){
  const totalSKU = rows.length;
  const totalPN = new Set(rows.map(r=>r.partNumber)).size;
  const hargaTertinggi = rows.length ? Math.max(...rows.map(r=>r.harga)) : 0;
  const rataRata = rows.length ? rows.reduce((s,r)=>s+r.harga,0)/rows.length : 0;

  const kpis = [
    {label:'Total Item (Hasil Filter)', value: totalSKU.toLocaleString('id-ID'), icon:`<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/><path d="M12 22.08V12"/>`},
    {label:'Total Part Number Unik', value: totalPN.toLocaleString('id-ID'), icon:`<path d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83Z"/><circle cx="7.5" cy="7.5" r="1.5"/>`},
    {label:'Harga Tertinggi', value: idr(hargaTertinggi), icon:`<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>`},
    {label:'Rata-Rata Harga Tertinggi', value: idr(rataRata), icon:`<path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>`},
  ];

  document.getElementById('kpiRow').innerHTML = kpis.map(k=>`
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${k.icon}</svg></div>
        <div class="kpi-label">${k.label}</div>
      </div>
      <div class="kpi-value">${k.value}</div>
    </div>
  `).join('');
}

/* ============== TOAST ============== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

/* ============== EXPORT ============== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStamp(){
  const d = new Date();
  return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;
}
function exportExcel(){
  const rows = getResultRows();
  if(rows.length === 0){ showToast('Tidak ada data untuk diexport'); return; }
  let html = '<table border="1"><tr>'
    + '<th>No</th><th>Part Number</th><th>Kode Barang</th><th>Nama Barang</th><th>UOM</th><th>Harga Tertinggi</th>'
    + '</tr>';
  rows.forEach((r,i)=>{
    html += `<tr><td>${i+1}</td><td>${escapeHtml(r.partNumber)}</td><td>${escapeHtml(r.kodeBarang)}</td><td>${escapeHtml(r.namaBarang)}</td><td>${escapeHtml(r.uom)}</td><td>${r.harga}</td></tr>`;
  });
  html += '</table>';
  const blob = new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Report_Harga_Beli_Tertinggi_${todayStamp()}.xls`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast(`Export Excel berhasil — ${rows.length} baris data`);
}
function exportPDF(){
  const rows = getResultRows();
  if(rows.length === 0){ showToast('Tidak ada data untuk diexport'); return; }
  const w = window.open('', '_blank');
  if(!w){ showToast('Popup diblokir browser — izinkan popup untuk export PDF'); return; }
  const style = `
    <style>
      body{font-family:Arial,Helvetica,sans-serif;padding:28px;color:#16202E;}
      h1{font-size:17px;margin:0 0 4px;}
      .meta{font-size:11.5px;color:#5B6779;margin-bottom:18px;}
      table{width:100%;border-collapse:collapse;font-size:11px;}
      th,td{border:1px solid #C7D0DE;padding:6px 9px;text-align:left;}
      th{background:#F2F5FE;text-transform:uppercase;font-size:10px;letter-spacing:.03em;color:#5B6779;}
      td.num, th.num{text-align:right;}
      td.center, th.center{text-align:center;}
    </style>`;
  let html = `<html><head><title>Report Daftar Harga Beli Tertinggi</title>${style}</head><body>`;
  html += `<h1>Report Daftar Harga Beli Tertinggi</h1>`;
  html += `<div class="meta">Dicetak: ${new Date().toLocaleString('id-ID')} &middot; Total data: ${rows.length}</div>`;
  html += `<table><thead><tr><th>No</th><th>Part Number</th><th>Kode Barang</th><th>Nama Barang</th><th class="center">UOM</th><th class="num">Harga Tertinggi</th></tr></thead><tbody>`;
  rows.forEach((r,i)=>{
    html += `<tr><td>${i+1}</td><td>${escapeHtml(r.partNumber)}</td><td>${escapeHtml(r.kodeBarang)}</td><td>${escapeHtml(r.namaBarang)}</td><td class="center">${escapeHtml(r.uom)}</td><td class="num">${idr(r.harga)}</td></tr>`;
  });
  html += '</tbody></table></body></html>';
  w.document.open();
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(()=>{ w.print(); }, 350);
}

/* ============== INIT ============== */
initFilterOptions();
render();
</script>
</body>
</html>
