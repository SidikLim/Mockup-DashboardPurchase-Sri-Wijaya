<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan — User &amp; Hak Akses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDF1F6;
    --surface:#FFFFFF;
    --surface-alt:#F5F7FB;
    --border:#E1E7F0;
    --border-soft:#EBEFF5;
    --text-primary:#16202E;
    --text-secondary:#5B6779;
    --text-muted:#8B95A6;
    --navy:#122A55;
    --blue-700:#1E4FBF;
    --blue-600:#2F63E0;
    --blue-500:#4C7EF2;
    --blue-100:#E4ECFC;
    --blue-50:#F2F5FE;
    --success:#0E9C6F;
    --success-bg:#E4F7EE;
    --danger:#DB4B5C;
    --danger-bg:#FCE9EB;
    --amber:#B5820A;
    --amber-bg:#FBF1DA;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(20,34,64,.05);
    --shadow-md:0 8px 24px -8px rgba(20,34,64,.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text-primary);}
  .app{max-width:1360px;margin:0 auto;padding:24px 24px 64px;}

  /* ---------- TABS ---------- */
  .tabs{
    display:flex;gap:6px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;padding:5px;
    width:fit-content;margin-bottom:20px;box-shadow:var(--shadow-sm);
  }
  .tab-btn{
    border:none;background:none;padding:9px 20px;border-radius:8px;
    font-family:'Sora',sans-serif;font-weight:600;font-size:13.5px;color:var(--text-secondary);
    cursor:pointer;transition:.15s;
  }
  .tab-btn.active{background:var(--blue-700);color:#fff;box-shadow:0 2px 8px rgba(30,79,191,.3);}
  .tab-btn:not(.active):hover{background:var(--surface-alt);color:var(--text-primary);}

  .tab-panel{display:none;}
  .tab-panel.active{display:block;}

  /* ---------- PANEL ---------- */
  .panel{
    background:var(--surface);border-radius:var(--radius);border:1px solid var(--border-soft);
    box-shadow:var(--shadow-sm);
  }
  .panel-header{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:18px 22px;border-bottom:1px solid var(--border-soft);
  }
  .panel-title{display:flex;align-items:center;gap:10px;}
  .panel-title-ic{
    width:32px;height:32px;border-radius:9px;background:var(--blue-50);color:var(--blue-600);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .panel-title-ic svg{width:16px;height:16px;}
  .panel-title h3{margin:0;font-size:15px;font-weight:700;font-family:'Sora',sans-serif;}
  .panel-title span{display:block;font-size:12px;color:var(--text-muted);margin-top:1px;}

  .btn-primary-sm{
    display:inline-flex;align-items:center;gap:7px;border:none;
    background:linear-gradient(135deg,var(--blue-500),var(--blue-700));color:#fff;
    font-family:'Inter',sans-serif;font-size:13px;font-weight:600;border-radius:9px;
    padding:9px 15px;cursor:pointer;transition:.15s;box-shadow:0 6px 16px rgba(44,92,224,.24);
  }
  .btn-primary-sm:hover{filter:brightness(1.05);}
  .btn-primary-sm svg{width:15px;height:15px;flex-shrink:0;}

  /* ---------- USERS TABLE ---------- */
  .table-scroll{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;min-width:820px;}
  thead th{
    background:var(--surface-alt);text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--text-secondary);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap;
  }
  tbody td{padding:12px 16px;font-size:13px;color:var(--text-primary);border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  tbody tr:hover{background:var(--blue-50);}
  .user-name{font-weight:600;}
  .user-email{color:var(--text-muted);font-size:12px;margin-top:1px;}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600;}
  .badge.role{background:var(--blue-50);color:var(--blue-700);}
  .badge.role.admin{background:var(--navy);color:#fff;}
  .badge.status-active{background:var(--success-bg);color:var(--success);}
  .badge.status-inactive{background:var(--surface-alt);color:var(--text-muted);border:1px solid var(--border);}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .row-actions{display:flex;gap:6px;}
  .icon-btn{
    width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);transition:.15s;
  }
  .icon-btn svg{width:14px;height:14px;}
  .icon-btn:hover{border-color:var(--blue-500);color:var(--blue-700);background:var(--blue-50);}
  .icon-btn.danger:hover{border-color:#F3C6CB;color:var(--danger);background:var(--danger-bg);}

  /* ---------- ROLES ---------- */
  .roles-wrap{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .role-card{
    border:1px solid var(--border-soft);border-radius:12px;background:var(--surface-alt);overflow:hidden;
  }
  .role-card-head{
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
    padding:14px 18px;cursor:pointer;user-select:none;
  }
  .role-card-head:hover{background:var(--blue-50);}
  .role-card-left{display:flex;align-items:center;gap:12px;}
  .role-ic{
    width:34px;height:34px;border-radius:9px;background:var(--blue-100);color:var(--blue-700);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .role-ic svg{width:16px;height:16px;}
  .role-card-left h4{margin:0;font-size:14px;font-weight:700;font-family:'Sora',sans-serif;}
  .role-card-left .sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .role-card-right{display:flex;align-items:center;gap:10px;}
  .role-chev{transition:.2s transform;color:var(--text-muted);flex-shrink:0;}
  .role-card.open .role-chev{transform:rotate(180deg);}
  .role-card-body{display:none;padding:6px 18px 18px;}
  .role-card.open .role-card-body{display:block;}
  .menu-grid{
    display:grid;grid-template-columns:repeat(auto-fill, minmax(220px,1fr));gap:10px;
    background:#fff;border:1px solid var(--border-soft);border-radius:10px;padding:14px;
  }
  .menu-check{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 4px;}
  .menu-check .num{
    font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--text-muted);
    background:var(--surface-alt);border-radius:5px;padding:2px 6px;flex-shrink:0;
  }
  .switch{position:relative;width:38px;height:22px;flex-shrink:0;}
  .switch input{opacity:0;width:0;height:0;}
  .switch .track{
    position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.2s;
  }
  .switch .track::before{
    content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;
    transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .switch input:checked + .track{background:var(--blue-600);}
  .switch input:checked + .track::before{transform:translateX(16px);}
  .switch input:disabled + .track{opacity:.5;cursor:not-allowed;}
  .role-card-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .protected-note{font-size:11.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;}
  .protected-note svg{width:13px;height:13px;flex-shrink:0;}
  .btn-outline-sm{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;
    color:var(--text-secondary);font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;border-radius:8px;
    padding:7px 12px;cursor:pointer;transition:.15s;
  }
  .btn-outline-sm:hover{border-color:var(--blue-500);color:var(--blue-700);background:var(--blue-50);}
  .btn-outline-sm.danger:hover{border-color:#F3C6CB;color:var(--danger);background:var(--danger-bg);}
  .btn-save-sm{
    display:inline-flex;align-items:center;gap:6px;border:none;background:linear-gradient(135deg,var(--blue-500),var(--blue-700));
    color:#fff;font-family:'Inter',sans-serif;font-size:12.5px;font-weight:600;border-radius:8px;
    padding:7px 14px;cursor:pointer;transition:.15s;
  }
  .btn-save-sm:hover{filter:brightness(1.05);}

  /* ---------- MODAL ---------- */
  .overlay{
    display:none;position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:200;
    align-items:center;justify-content:center;padding:20px;
  }
  .overlay.open{display:flex;}
  .modal{
    background:#fff;border-radius:16px;width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
    box-shadow:0 24px 60px -20px rgba(16,24,40,.35);
  }
  .modal-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px;border-bottom:1px solid var(--border-soft);
  }
  .modal-head h3{margin:0;font-size:15.5px;font-family:'Sora',sans-serif;font-weight:700;}
  .modal-head button{background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;}
  .modal-head button:hover{color:var(--text-primary);}
  .modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:14px;}
  .form-field label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
  .form-field input, .form-field select{
    width:100%;border:1px solid var(--border);background:var(--surface-alt);border-radius:9px;
    padding:10px 12px;font-size:13.5px;font-family:'Inter',sans-serif;color:var(--text-primary);
  }
  .form-field input:focus, .form-field select:focus{
    outline:none;border-color:var(--blue-500);background:#fff;box-shadow:0 0 0 3px var(--blue-100);
  }
  .form-field .hint{font-size:11.5px;color:var(--text-muted);margin-top:5px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .modal-foot{
    display:flex;align-items:center;justify-content:flex-end;gap:10px;
    padding:16px 22px;border-top:1px solid var(--border-soft);
  }

  .toast{
    position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;
    padding:13px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-md);
    display:flex;align-items:center;gap:10px;transform:translateY(20px);opacity:0;
    transition:.25s;pointer-events:none;z-index:300;
  }
  .toast.show{transform:translateY(0);opacity:1;}
  .toast svg{width:16px;height:16px;color:#4ADE80;flex-shrink:0;}

  @media (max-width:640px){
    .app{padding:16px 14px 40px;}
    .form-row{grid-template-columns:1fr;}
    .menu-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">

  <div class="tabs">
    <button class="tab-btn active" data-tab="users" onclick="switchTab('users')">Manajemen User</button>
    <button class="tab-btn" data-tab="roles" onclick="switchTab('roles')">Hak Akses &amp; Role</button>
  </div>

  <!-- ===== USERS PANEL ===== -->
  <div class="panel tab-panel active" id="panel-users">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div>
          <h3>Manajemen User</h3>
          <span>Kelola akun login pengguna sistem SCM Analytics Suite</span>
        </div>
      </div>
      <button class="btn-primary-sm" onclick="openUserModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambah User
      </button>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Nama</th>
            <th>Username</th>
            <th>Role</th>
            <th>Status</th>
            <th>Login Terakhir</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ===== ROLES / ACCESS PANEL ===== -->
  <div class="panel tab-panel" id="panel-roles">
    <div class="panel-header">
      <div class="panel-title">
        <div class="panel-title-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        </div>
        <div>
          <h3>Hak Akses &amp; Role</h3>
          <span>Atur menu apa saja yang dapat diakses oleh setiap role</span>
        </div>
      </div>
      <button class="btn-primary-sm" onclick="openRoleModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Tambah Role
      </button>
    </div>
    <div class="roles-wrap" id="rolesWrap"></div>
  </div>

</div>

<!-- ===== USER MODAL ===== -->
<div class="overlay" id="userOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="userModalTitle">Tambah User</h3>
      <button onclick="closeUserModal()" aria-label="Tutup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>Nama Lengkap</label>
        <input type="text" id="fNama" placeholder="Contoh: Budi Santoso">
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Username</label>
          <input type="text" id="fUsername" placeholder="budi.santoso">
        </div>
        <div class="form-field">
          <label>Email</label>
          <input type="email" id="fEmail" placeholder="budi.santoso@company.co.id">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>Password</label>
          <input type="password" id="fPassword" placeholder="••••••••">
          <div class="hint" id="fPasswordHint">Minimal 6 karakter</div>
        </div>
        <div class="form-field">
          <label>Role</label>
          <select id="fRole"></select>
        </div>
      </div>
      <div class="form-field">
        <label>Status Akun</label>
        <select id="fStatus">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-outline-sm" onclick="closeUserModal()">Batal</button>
      <button class="btn-save-sm" onclick="saveUser()">Simpan User</button>
    </div>
  </div>
</div>

<!-- ===== ROLE MODAL (add new) ===== -->
<div class="overlay" id="roleOverlay">
  <div class="modal" style="max-width:400px;">
    <div class="modal-head">
      <h3>Tambah Role Baru</h3>
      <button onclick="closeRoleModal()" aria-label="Tutup">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-field">
        <label>Nama Role</label>
        <input type="text" id="fRoleName" placeholder="Contoh: Staff Finance">
        <div class="hint">Hak akses menu dapat diatur setelah role dibuat.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-outline-sm" onclick="closeRoleModal()">Batal</button>
      <button class="btn-save-sm" onclick="saveRole()">Simpan Role</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============== MENU LIST (harus sinkron dengan sidebar) ============== */
const MENUS = [
  {key:'monitoring', label:'SCM Monitoring', num:'01'},
  {key:'po', label:'Outstanding PO', num:'02'},
  {key:'grn', label:'Outstanding GRN', num:'03'},
  {key:'vendor', label:'Vendor Price List', num:'04'},
  {key:'fsn', label:'Analisis FSN', num:'05'},
  {key:'report', label:'Report Harga Beli Tertinggi', num:'06'},
  {key:'settings', label:'Pengaturan', num:'07'},
];

/* ============== SAMPLE DATA (in-memory, tidak persisten) ============== */
let ROLES = [
  {id:1, name:'Administrator', protected:true, access:new Set(MENUS.map(m=>m.key))},
  {id:2, name:'Supervisor SCM', protected:false, access:new Set(['monitoring','po','grn','vendor','fsn','report'])},
  {id:3, name:'Staff Procurement', protected:false, access:new Set(['monitoring','po','vendor','report'])},
  {id:4, name:'Staff Gudang', protected:false, access:new Set(['monitoring','grn'])},
  {id:5, name:'Viewer', protected:false, access:new Set(['monitoring'])},
];
let roleSeq = 5;

let USERS = [
  {id:1, nama:'Budi Santoso', username:'budi.santoso', email:'budi.santoso@company.co.id', roleId:1, status:'active', lastLogin:'27 Jul 2026, 08:12'},
  {id:2, nama:'Sri Handayani', username:'sri.handayani', email:'sri.handayani@company.co.id', roleId:2, status:'active', lastLogin:'26 Jul 2026, 17:40'},
  {id:3, nama:'Adika Pratama', username:'adika.pratama', email:'adika.pratama@company.co.id', roleId:3, status:'active', lastLogin:'25 Jul 2026, 09:05'},
  {id:4, nama:'Irfan Maulana', username:'irfan.maulana', email:'irfan.maulana@company.co.id', roleId:4, status:'inactive', lastLogin:'12 Jul 2026, 14:22'},
  {id:5, nama:'Dewi Lestari', username:'dewi.lestari', email:'dewi.lestari@company.co.id', roleId:5, status:'active', lastLogin:'20 Jul 2026, 10:47'},
];
let userSeq = 5;
let editingUserId = null;
let openRoleCardId = 1;

/* ============== TABS ============== */
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('panel-users').classList.toggle('active', tab==='users');
  document.getElementById('panel-roles').classList.toggle('active', tab==='roles');
}

/* ============== ROLE HELPERS ============== */
function roleById(id){ return ROLES.find(r=>r.id===id); }
function roleName(id){ const r = roleById(id); return r ? r.name : '—'; }

/* ============== RENDER USERS ============== */
function renderUsers(){
  const tbody = document.getElementById('usersBody');
  tbody.innerHTML = USERS.map((u,i)=>{
    const role = roleById(u.roleId);
    const roleBadgeClass = role && role.protected ? 'badge role admin' : 'badge role';
    const statusBadge = u.status === 'active'
      ? `<span class="badge status-active"><span class="dot"></span>Active</span>`
      : `<span class="badge status-inactive"><span class="dot"></span>Inactive</span>`;
    return `
      <tr>
        <td>${i+1}</td>
        <td>
          <div class="user-name">${escapeHtml(u.nama)}</div>
          <div class="user-email">${escapeHtml(u.email)}</div>
        </td>
        <td>${escapeHtml(u.username)}</td>
        <td><span class="${roleBadgeClass}">${escapeHtml(roleName(u.roleId))}</span></td>
        <td>${statusBadge}</td>
        <td>${escapeHtml(u.lastLogin)}</td>
        <td>
          <div class="row-actions">
            <button class="icon-btn" title="Edit user" onclick="openUserModal(${u.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
            </button>
            <button class="icon-btn danger" title="Hapus user" onclick="deleteUser(${u.id})">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
            </button>
          </div>
        </td>
      </tr>
    `;
  }).join('');
}

/* ============== RENDER ROLES ============== */
function renderRoleSelect(){
  const sel = document.getElementById('fRole');
  sel.innerHTML = ROLES.map(r=>`<option value="${r.id}">${escapeHtml(r.name)}</option>`).join('');
}

function renderRoles(){
  const wrap = document.getElementById('rolesWrap');
  wrap.innerHTML = ROLES.map(r=>{
    const userCount = USERS.filter(u=>u.roleId===r.id).length;
    const isOpen = openRoleCardId === r.id;
    const menuGrid = MENUS.map(m=>{
      const checked = r.access.has(m.key) ? 'checked' : '';
      const disabled = r.protected ? 'disabled' : '';
      return `
        <label class="menu-check">
          <label class="switch">
            <input type="checkbox" ${checked} ${disabled} onchange="toggleRoleAccess(${r.id}, '${m.key}', this.checked)">
            <span class="track"></span>
          </label>
          <span class="num">${m.num}</span>
          <span>${m.label}</span>
        </label>
      `;
    }).join('');
    return `
      <div class="role-card ${isOpen ? 'open' : ''}" id="roleCard-${r.id}">
        <div class="role-card-head" onclick="toggleRoleCard(${r.id})">
          <div class="role-card-left">
            <div class="role-ic">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <div>
              <h4>${escapeHtml(r.name)}${r.protected ? ' <span class="badge role admin" style="margin-left:6px;">Admin</span>' : ''}</h4>
              <div class="sub">${r.access.size} dari ${MENUS.length} menu diizinkan &middot; ${userCount} user</div>
            </div>
          </div>
          <div class="role-card-right">
            <svg class="role-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </div>
        </div>
        <div class="role-card-body">
          <div class="menu-grid">${menuGrid}</div>
          <div class="role-card-foot">
            ${r.protected
              ? `<div class="protected-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>Role Administrator selalu memiliki akses penuh dan tidak dapat diubah.</div>`
              : `<button class="btn-outline-sm danger" onclick="deleteRole(${r.id})">Hapus Role</button>`
            }
            <button class="btn-save-sm" onclick="saveRoleAccess(${r.id})">Simpan Hak Akses</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

function toggleRoleCard(id){
  openRoleCardId = (openRoleCardId === id) ? null : id;
  renderRoles();
}
function toggleRoleAccess(roleId, menuKey, checked){
  const role = roleById(roleId);
  if(!role || role.protected) return;
  if(checked) role.access.add(menuKey);
  else role.access.delete(menuKey);
}
function saveRoleAccess(roleId){
  renderRoles();
  showToast(`Hak akses role "${roleName(roleId)}" berhasil disimpan`);
}
function deleteRole(roleId){
  const role = roleById(roleId);
  if(!role || role.protected) return;
  const inUse = USERS.some(u=>u.roleId===roleId);
  if(inUse){
    showToast(`Role "${role.name}" masih digunakan oleh user aktif — pindahkan user terlebih dahulu`);
    return;
  }
  if(!confirm(`Hapus role "${role.name}"?`)) return;
  ROLES = ROLES.filter(r=>r.id!==roleId);
  renderRoleSelect();
  renderRoles();
  showToast(`Role "${role.name}" berhasil dihapus`);
}

/* ============== ROLE MODAL ============== */
function openRoleModal(){
  document.getElementById('fRoleName').value = '';
  document.getElementById('roleOverlay').classList.add('open');
}
function closeRoleModal(){
  document.getElementById('roleOverlay').classList.remove('open');
}
function saveRole(){
  const name = document.getElementById('fRoleName').value.trim();
  if(!name){ showToast('Nama role wajib diisi'); return; }
  roleSeq++;
  ROLES.push({id:roleSeq, name, protected:false, access:new Set()});
  openRoleCardId = roleSeq;
  renderRoleSelect();
  renderRoles();
  closeRoleModal();
  showToast(`Role "${name}" berhasil ditambahkan`);
}

/* ============== USER MODAL ============== */
function openUserModal(id){
  editingUserId = id || null;
  renderRoleSelect();
  const title = document.getElementById('userModalTitle');
  const pwHint = document.getElementById('fPasswordHint');
  if(id){
    const u = USERS.find(x=>x.id===id);
    title.textContent = 'Edit User';
    document.getElementById('fNama').value = u.nama;
    document.getElementById('fUsername').value = u.username;
    document.getElementById('fEmail').value = u.email;
    document.getElementById('fPassword').value = '';
    document.getElementById('fRole').value = u.roleId;
    document.getElementById('fStatus').value = u.status;
    pwHint.textContent = 'Kosongkan jika tidak ingin mengubah password';
  } else {
    title.textContent = 'Tambah User';
    document.getElementById('fNama').value = '';
    document.getElementById('fUsername').value = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fPassword').value = '';
    document.getElementById('fRole').value = ROLES[0] ? ROLES[0].id : '';
    document.getElementById('fStatus').value = 'active';
    pwHint.textContent = 'Minimal 6 karakter';
  }
  document.getElementById('userOverlay').classList.add('open');
}
function closeUserModal(){
  document.getElementById('userOverlay').classList.remove('open');
  editingUserId = null;
}
function saveUser(){
  const nama = document.getElementById('fNama').value.trim();
  const username = document.getElementById('fUsername').value.trim();
  const email = document.getElementById('fEmail').value.trim();
  const password = document.getElementById('fPassword').value;
  const roleId = parseInt(document.getElementById('fRole').value);
  const status = document.getElementById('fStatus').value;

  if(!nama || !username || !email){ showToast('Nama, username, dan email wajib diisi'); return; }
  if(!editingUserId && password.length < 6){ showToast('Password minimal 6 karakter'); return; }
  if(password && password.length < 6){ showToast('Password minimal 6 karakter'); return; }

  const usernameTaken = USERS.some(u => u.username.toLowerCase() === username.toLowerCase() && u.id !== editingUserId);
  if(usernameTaken){ showToast('Username sudah digunakan, gunakan username lain'); return; }

  if(editingUserId){
    const u = USERS.find(x=>x.id===editingUserId);
    u.nama = nama; u.username = username; u.email = email; u.roleId = roleId; u.status = status;
    showToast(`User "${nama}" berhasil diperbarui`);
  } else {
    userSeq++;
    USERS.push({id:userSeq, nama, username, email, roleId, status, lastLogin:'Belum pernah login'});
    showToast(`User "${nama}" berhasil ditambahkan`);
  }
  renderUsers();
  renderRoles();
  closeUserModal();
}
function deleteUser(id){
  const u = USERS.find(x=>x.id===id);
  if(!u) return;
  if(!confirm(`Hapus user "${u.nama}"?`)) return;
  USERS = USERS.filter(x=>x.id!==id);
  renderUsers();
  renderRoles();
  showToast(`User "${u.nama}" berhasil dihapus`);
}

/* ============== TOAST ============== */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4L12 14.01l-3-3"/></svg><span>${msg}</span>`;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2800);
}

/* ============== UTIL ============== */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============== INIT ============== */
renderUsers();
renderRoles();
</script>
</body>
</html>
